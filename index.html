<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Banner Carousel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">My Website</div>

        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#gallery">Gallery</a></li>
            <li><a href="#contact">Contact Page</a></li>
        </ul>
    </nav>


    <!-- Home Section -->
    <section id="home">

        <!-- Banner Carousel -->
        <main id="gallery">
            <img src="images/banner1.jpg" alt="Banner 1" class="slider">
            <img src="images/banner2.jpg" alt="Banner 2" class="slider">
            <img src="images/banner3.jpg" alt="Banner 3" class="slider">
            <img src="images/banner4.jpg" alt="Banner 4" class="slider">

            <!-- Previous Button -->
            <button onclick="goPrev()" class="prev" aria-label="Previous slide">
                Prev
            </button>

            <!-- Next Button -->
            <button onclick="goNext()" class="next" aria-label="Next slide">
                Next
            </button>
        </main>

    </section>


    <!-- Slide Indicators -->
    <div class="dots-container">
        <span class="dot" onclick="currentSlide(0)" aria-label="Slide 1"></span>
        <span class="dot" onclick="currentSlide(1)" aria-label="Slide 2"></span>
        <span class="dot" onclick="currentSlide(2)" aria-label="Slide 3"></span>
        <span class="dot" onclick="currentSlide(3)" aria-label="Slide 4"></span>
    </div>


    <!-- Contact Section -->
    <!-- <section id="contact">
        <h2>Contact Page</h2>
        <p>Thank you for visiting My Website.</p>
    </section> -->


    <script src="script.js"></script>

</body>
</html>
